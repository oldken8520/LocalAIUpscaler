name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Download Real-ESRGAN
        shell: pwsh
        run: |
          $url = "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile realesrgan.zip
          Expand-Archive realesrgan.zip -DestinationPath engine

      - name: Prepare Real-ESRGAN engine
        shell: pwsh
        run: |
          $exe = Get-ChildItem engine -Recurse -Filter "realesrgan-ncnn-vulkan.exe" | Select-Object -First 1

          if (-not $exe) {
            throw "Real-ESRGAN executable not found"
          }

          $base = $exe.Directory.FullName

          New-Item -ItemType Directory -Force bundled_engine | Out-Null

          Copy-Item "$base\realesrgan-ncnn-vulkan.exe" bundled_engine\

          if (Test-Path "$base\vulkan-1.dll") {
            Copy-Item "$base\vulkan-1.dll" bundled_engine\
          }

          Copy-Item "$base\models" bundled_engine\models -Recurse

      - name: Build LocalAIUpscaler.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name LocalAIUpscaler `
            --add-data "bundled_engine;engine" `
            app.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIUpscaler-Windows
          path: dist/LocalAIUpscaler.exe
